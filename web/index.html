<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XNK Disk</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <button id="btn-home" class="brand-btn" title="All Installed Drives">
          <svg width="18" height="18" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="240" height="240" rx="54" fill="#0c0c0e" stroke="rgba(214,235,253,0.3)" stroke-width="10"/>
            <rect x="38" y="42" width="40" height="122" rx="10" fill="#2f81f7"/>
            <rect x="38" y="174" width="40" height="40" rx="10" fill="#27272a"/>
            <rect x="88" y="42" width="40" height="80" rx="10" fill="#2f81f7" opacity="0.82"/>
            <rect x="88" y="132" width="40" height="36" rx="10" fill="#ff7722"/>
            <rect x="138" y="42" width="40" height="50" rx="10" fill="#2f81f7" opacity="0.6"/>
            <rect x="138" y="132" width="40" height="22" rx="8" fill="#ff7722" opacity="0.64"/>
            <rect x="188" y="42" width="32" height="30" rx="8" fill="#2f81f7" opacity="0.42"/>
            <circle cx="204" cy="202" r="10" fill="#10b981"/>
          </svg>
          <span>Drives</span>
        </button>
        <div class="divider"></div>
        <div id="drive-pills" class="drive-pills"></div>
      </div>

      <div class="toolbar-right">
        <div id="view-controls" class="view-controls hidden">
          <div class="segmented">
            <button id="mode-scroll" class="seg-btn active" title="Fixed-width horizontally scrollable columns">Scrollable</button>
            <button id="mode-fit" class="seg-btn" title="Fit all visible levels into window">Fit</button>
          </div>
          <label class="select-pill" title="Maximum folder depth levels to display">
            <span>Depth</span>
            <select id="select-depth">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="0">Unlimited</option>
            </select>
          </label>
          <label class="checkbox-pill" title="Collapse tiny folders into an Other bucket">
            <input id="toggle-group" type="checkbox" />
            <span>Group &lt;1.2%</span>
          </label>
          <button id="btn-zoom-reset" class="zoom-pill hidden" title="Vertical zoom level (pinch with two fingers or ⌘+/⌘−; click or ⌘0 to reset)">1.0×</button>
        </div>

        <span id="top-capacity" class="top-capacity"></span>
        <span id="scan-meta" class="scan-meta"></span>

        <button id="btn-cancel" class="btn-secondary hidden">Cancel</button>
        <button id="btn-scan" class="btn-primary">
          <svg class="icon-spin-target" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
          <span id="btn-scan-label">Scan Disk</span>
        </button>
      </div>
    </header>

    <!-- Breadcrumb Bar -->
    <nav class="breadcrumb-bar">
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div class="breadcrumb-actions">
        <button id="btn-undo" class="btn-undo hidden" title="Put the last trashed item back (⌘Z)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M9 14L4 9l5-5"/>
            <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
          </svg>
          <span id="btn-undo-label">Undo</span>
        </button>
        <button id="btn-trash" class="btn-danger hidden" title="Move focused folder to macOS Trash">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/>
            <path d="M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
          <span>Move to Trash</span>
        </button>
        <button id="btn-reveal" class="btn-ghost hidden" title="Reveal focused folder in Finder">Reveal in Finder</button>
        <span id="cache-legend" class="cache-legend hidden" title="Green tiles mark recognized developer caches that rebuild themselves">
          <span class="cache-legend-dot"></span>
          <span>Rebuilds itself</span>
        </span>
        <span id="depth-hint" class="depth-hint"></span>
      </div>
    </nav>

    <!-- Live Scan Progress Strip -->
    <div id="scan-strip" class="scan-strip hidden">
      <div class="scan-strip-top">
        <span id="scan-path" class="scan-path">Starting parallel scan...</span>
        <span id="scan-counters" class="scan-counters"></span>
      </div>
      <div class="progress-track">
        <div id="scan-bar" class="progress-bar"></div>
      </div>
    </div>

    <!-- Main Viewport (Drives Overview OR Horizontal Icicle) -->
    <main id="viewport" class="viewport"></main>

    <!-- Floating Hover Tooltip for Icicle Blocks -->
    <div id="hover-tooltip" class="hover-tooltip hidden"></div>
    <!-- Context Menu for Icicle Blocks -->
    <div id="context-menu" class="context-menu hidden"></div>

    <!-- Action Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
